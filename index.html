<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoryToon AI — Film Production Studio</title>
  <link rel="stylesheet" href="style.css?v=24" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">🎬 <span>StoryToon Studio</span></div>
      <div class="badge">5-Agent Film Crew</div>
    </header>

    <main class="workspace">
      <section class="card control-card">
        <label class="field">
          <span>Google AI Studio (Gemini) API Key</span>
          <input type="password" id="apiKeyInput" placeholder="Paste AIzaSy... key here" />
        </label>

        <label class="field">
          <span>Story Topic / Movie Scene Idea</span>
          <textarea id="topicInput" rows="2" placeholder="e.g., Exam se ek raat pehle dost ka overconfidence..."></textarea>
        </label>

        <div class="row-2">
          <label class="field">
            <span>Platform Format</span>
            <select id="formatSelect">
              <option value="9:16" selected>Shorts / Reels (9:16)</option>
              <option value="16:9">YouTube Video (16:9)</option>
              <option value="1:1">Insta / FB Post (1:1)</option>
            </select>
          </label>
          <label class="field">
            <span>Auto-Episode Mode</span>
            <select id="episodeModeSelect">
              <option value="1" selected>Single Short (~45s • 1 Video)</option>
              <option value="3">Mini Episode (~2.5m • 3 Videos)</option>
              <option value="5">Full YouTube Ep (~5m • 5 Videos)</option>
              <option value="8">Mega Episode (~8m • 8 Videos)</option>
            </select>
          </label>
        </div>

        <div class="row-2">
          <label class="field">
            <span>Vibe / Genre</span>
            <select id="toneSelect">
              <option value="Relatable Desi Storytime" selected>Relatable Storytime</option>
              <option value="Savage & Brutal Roast">🔥 Savage & Brutal Roast</option>
              <option value="Dark Comedy & Plot Twist">💀 Dark Comedy & Twist</option>
              <option value="Double Meaning Naughty Comedy">😏 Double Meaning (Desi)</option>
              <option value="Desi Comedy + Superpower">⚡ Comedy + Superpower</option>
              <option value="Hero vs Villain Anime">⚔️ Hero vs Villain</option>
            </select>
          </label>
          <label class="field">
            <span>Voice Engine</span>
            <select id="voiceEngineSelect">
              <option value="auto" selected>Auto (Gemini + Edge Hindi)</option>
              <option value="edge">Edge Neural Hindi (Fast Free)</option>
              <option value="gemini">Gemini Multi-Speaker TTS</option>
            </select>
          </label>
        </div>

        <div class="crew-board" id="crewBoard">
          <div class="crew-chip" id="crew-writer"><b>✍️</b><span>Writer</span></div>
          <div class="crew-chip" id="crew-director"><b>🎥</b><span>DOP/Dir</span></div>
          <div class="crew-chip" id="crew-light"><b>💡</b><span>Lightman</span></div>
          <div class="crew-chip" id="crew-sound"><b>🎙️</b><span>Sound</span></div>
          <div class="crew-chip" id="crew-editor"><b>✂️</b><span>Editor</span></div>
        </div>

        <button id="oneClickAutoBtn" class="btn accent" style="width:100%;padding:13px;font-size:0.96rem;">
          🎬 Action! Auto-Produce & Download Video
        </button>

        <div class="btn-row">
          <button id="generateScriptBtn" class="btn secondary" style="font-size:0.78rem;">Crew Pre-Production Only</button>
          <button id="playRecordBtn" class="btn primary" style="font-size:0.78rem;">Shoot & Export Current</button>
        </div>
        <div id="statusBar" class="status-bar">Film Crew ready! Vibe chuno, Topic likho aur "🎬 Action!" dabao.</div>
      </section>

      <section class="card stage-card">
        <div class="canvas-wrap" id="canvasWrap" style="aspect-ratio:9/16;max-width:330px;">
          <canvas id="stageCanvas" width="720" height="1280"></canvas>
        </div>
        <div class="stage-actions">
          <button id="previewOnlyBtn" class="btn secondary">▶ Preview Cut</button>
          <a id="downloadLink" class="btn success hidden" download="storytoon_episode.mp4">⬇ Download Video</a>
        </div>
      </section>

      <section class="card script-card">
        <div class="script-header">
          <span>Shooting Script (Director + Lightman Cut)</span>
          <button id="loadDemoBtn" class="btn tiny">Load Demo</button>
        </div>
        <textarea id="scriptEditor" rows="7"></textarea>
      </section>
    </main>
  </div>
  <script src="app.js?v=24"></script>
</body>
</html>
