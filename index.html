<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoryToon AI v42.0 — Human Acting, Per-Character Reactions & Sarvam Desi Studio</title>
  <link rel="stylesheet" href="style.css?v=42" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">🎬 <span>StoryToon Studio</span></div>
      <div class="badge" id="appVersionBadge">Build v42.0</div>
    </header>

    <main class="workspace">
      <section class="card control-card">
        <div class="row-2">
          <label class="field">
            <span>Gemini API Key(s)</span>
            <input type="password" id="apiKeyInput" placeholder="AIzaSyKey1, AIzaSyKey2" />
          </label>
          <label class="field">
            <span>Sarvam AI Key (Hyper-Desi)</span>
            <input type="password" id="sarvamKeyInput" placeholder="sk_... (dashboard.sarvam.ai)" />
          </label>
        </div>

        <!-- DUAL INPUT MODE SWITCHER -->
        <div class="btn-row" style="margin-bottom:4px;">
          <button type="button" id="modeTopicBtn" class="btn primary" style="font-size:0.8rem;">💡 Topic Se Banao (AI)</button>
          <button type="button" id="modeCustomScriptBtn" class="btn secondary" style="font-size:0.8rem;">📝 Apni Script Paste Karo</button>
        </div>

        <!-- PANEL A: TOPIC INPUT -->
        <div id="topicInputWrap">
          <label class="field">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span>Story Topic / Movie Scene Idea</span>
              <button type="button" id="randomTopicBtn" class="btn tiny" style="background:#334155;color:#fef08a;">🎲 Random Viral Topic</button>
            </div>
            <textarea id="topicInput" rows="2" placeholder="e.g., Office mein boss ki chugli karte waqt peeche khud boss khada tha..."></textarea>
          </label>
        </div>

        <!-- PANEL B: CUSTOM SCRIPT INPUT -->
        <div id="customScriptWrap" class="hidden">
          <label class="field">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span>Apni Script Likho / Paste Karo (Plain Dialogues ya JSON)</span>
              <button type="button" id="fillSampleCustomBtn" class="btn tiny" style="background:#334155;color:#38bdf8;">✨ Sample Format</button>
            </div>
            <textarea id="customScriptInput" rows="5" placeholder="Hero: Bhai aaj meri gf cafe mein aa rahi hai!&#10;Bro: Saale bill ke paise hain ya phir bartan dhoyega?&#10;GF: Sorry guys late ho gayi, aaj ka treat meri taraf se!"></textarea>
          </label>
        </div>

        <div class="row-2">
          <label class="field">
            <span>Platform Format</span>
            <select id="formatSelect">
              <option value="9:16" selected>Shorts / Reels (9:16)</option>
              <option value="16:9">YouTube Video (16:9)</option>
              <option value="1:1">Insta / FB Post (1:1)</option>
            </select>
          </label>
          <label class="field">
            <span>Duration / Episode Mode</span>
            <select id="episodeModeSelect">
              <option value="1_45" selected>Single Short (~45s • 1 Video)</option>
              <option value="1_60">1 Minute Short (~60s • 1 Video)</option>
              <option value="3">Mini Episode (~2.5m • 3 Videos)</option>
              <option value="5">Full YouTube Ep (~5m • 5 Videos)</option>
              <option value="8">Mega Episode (~8m • 8 Videos)</option>
            </select>
          </label>
        </div>

        <div class="row-2">
          <label class="field">
            <span>Vibe / Genre</span>
            <select id="toneSelect">
              <option value="Unfiltered Desi Roast + 18+ Banter" selected>🤬 Unfiltered Desi Roast + 18+ Banter</option>
              <option value="Double Meaning Naughty Comedy">😏 Bold Double Meaning (Desi 18+)</option>
              <option value="Savage & Brutal Roast">🔥 Savage & Brutal Roast</option>
              <option value="Relatable Desi Storytime">Relatable Storytime</option>
              <option value="Emotional & Deep Metaphor">🎭 Emotional & Deep Metaphor</option>
              <option value="Dark Comedy & Plot Twist">💀 Dark Comedy & Twist</option>
            </select>
          </label>
          <label class="field">
            <span>Voice Engine (Expressive Acting)</span>
            <select id="voiceEngineSelect">
              <option value="auto" selected>Auto (Sarvam if Key / Expressive Neural)</option>
              <option value="sarvam">🇮🇳 Sarvam AI Desi (Bulbul v2)</option>
              <option value="edge">4-Voice Expressive Indian Neural (Free)</option>
              <option value="gemini">Gemini 4-Actor Studio (Multi-Key)</option>
              <option value="hf">Hugging Face Neural AI (Free)</option>
            </select>
          </label>
        </div>

        <div class="crew-board" id="crewBoard">
          <div class="crew-chip" id="crew-writer"><b>✍️</b><span>Writer</span></div>
          <div class="crew-chip" id="crew-director"><b>🎥</b><span>DOP/VFX</span></div>
          <div class="crew-chip" id="crew-light"><b>👔</b><span>Set/Costume</span></div>
          <div class="crew-chip" id="crew-sound"><b>🎙️</b><span>Sound</span></div>
          <div class="crew-chip" id="crew-editor"><b>✂️</b><span>Editor/QC</span></div>
        </div>

        <button id="oneClickAutoBtn" class="btn accent" style="width:100%;padding:13px;font-size:0.96rem;">
          🎬 Action! Produce & Download Video
        </button>

        <div class="btn-row">
          <button id="generateScriptBtn" class="btn secondary" style="font-size:0.78rem;">Crew Pre-Production Only</button>
          <button id="playRecordBtn" class="btn primary" style="font-size:0.78rem;">Shoot & Export Current</button>
        </div>
        <div id="statusBar" class="status-bar">[v42.0] Ready! Per-Character Human Acting + Sarvam AI Strict Mode + Real Censor Beep active!</div>
      </section>

      <section class="card stage-card">
        <div class="canvas-wrap" id="canvasWrap" style="aspect-ratio:9/16;max-width:330px;">
          <canvas id="stageCanvas" width="720" height="1280"></canvas>
        </div>
        <div class="stage-actions">
          <button id="previewOnlyBtn" class="btn secondary">▶ Preview Cut</button>
          <a id="downloadLink" class="btn success hidden" download="storytoon_episode.webm">⬇ Download Video</a>
        </div>
      </section>

      <section class="card script-card">
        <div class="script-header">
          <span>Final Shooting Script (JSON • Per-Character Reactions)</span>
          <button id="loadDemoBtn" class="btn tiny">Load Demo</button>
        </div>
        <textarea id="scriptEditor" rows="7"></textarea>
      </section>
    </main>
  </div>
  <script src="app.js?v=42"></script>
</body>
</html>
